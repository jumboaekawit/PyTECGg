[package]
name = "pytecgg"
version = "1.4.0"
edition = "2021"
description = "Total Electron Content (TEC) reconstruction with GNSS data – a Python package with a Rust core"
license = "GPL-3.0-or-later"
readme = "README.md"
authors = ["Vincenzo Ventriglia <vincenzo.ventriglia@outlook.com>"]
repository = "https://github.com/viventriglia/PyTECGg"
exclude = [
  "rinex/*",
  "tests/*",
  ".github/*",
  "docs/*",
  "tools/*",
  "mkdocs.yml",
  ".gitignore"
]

[lib]
name = "pytecgg"
crate-type = ["cdylib"]

[dependencies]
rinex = { version = "0.24.0", features = ["flate2"] }
flate2 = "1.1.10"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
polars = { version = "0.55.2", features = ["lazy", "dtype-datetime"] }
pyo3-polars = "0.28.0"
